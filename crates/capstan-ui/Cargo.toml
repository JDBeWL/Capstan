[package]
name = "capstan-ui"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GPUI view layer for Capstan: entities, components and theming."

[dependencies]
capstan-core = { workspace = true }
capstan-audio = { workspace = true }
# 独占后端依赖 capstan-audio（复用解码链），所以装配它只能在这一层：由这里把工厂注入音频线程。
capstan-audio-exclusive = { path = "../capstan-audio-exclusive" }
gpui = { workspace = true }
gpui-platform = { workspace = true }
gpui-component = { workspace = true }
gpui-base = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# release 下没有控制台（windows_subsystem="windows"），日志必须落文件，见 src/logging.rs
log = "0.4"
# 持久化层要给出可区分的错误，见 src/persist/error.rs
thiserror = { workspace = true }
# 只为「按时间问候」取本地小时数；gpui 已依赖 chrono，不新增依赖树。
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
    "bmp",
] }

[lints]
workspace = true
