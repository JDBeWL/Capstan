[package]
name = "capstan-taskbar"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Windows taskbar thumbnail and thumbnail-toolbar integration."

[dependencies]
log = "0.4"

[target.'cfg(windows)'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_Storage_Xps",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Win32 FFI 全是 unsafe；workspace 的 forbid 只对继承它的 crate 生效，这个 crate 不继承。
[lints.rust]
unsafe_code = "allow"
